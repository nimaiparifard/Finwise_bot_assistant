{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  <li>
    <form method="post" action="{% url 'admin:courses_course_crawl' %}" style="display:inline">
      {% csrf_token %}
      <button type="submit" class="button" style="padding:6px 12px;border-radius:15px"
              onclick="this.disabled=true;this.innerText='در حال خزش سایت…';this.form.submit();">
        خزش سایت و به‌روزرسانی دوره‌ها
      </button>
    </form>
  </li>
  {{ block.super }}
{% endblock %}
