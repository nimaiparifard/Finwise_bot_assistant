<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<title>دستیار هوشمند فین‌وایز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #eef1f8; --panel: #ffffff; --text: #1a2133; --muted: #6a7389; --line: #e4e8f1;
    --brand: #2f5bea; --brand-strong: #2148c9; --brand-soft: #e8eeff; --on-brand: #ffffff;
    --bot-bg: #f1f3f9; --user-bg: #2f5bea; --user-text: #ffffff;
    --warn-bg: #fff4dc; --warn-text: #8a5a00; --danger-bg: #fdeaea; --danger-text: #a42525;
    --ok: #22b66a; --shadow: 0 12px 48px rgba(28, 42, 90, .14);
    --font: "Vazirmatn", Tahoma, "Segoe UI", system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #0c101c; --panel: #151a2b; --text: #e9edf9; --muted: #8f99b6; --line: #252c45;
    --brand: #5b82ff; --brand-strong: #7b9bff; --brand-soft: #1e2850; --on-brand: #0c101c;
    --bot-bg: #1e2540; --user-bg: #3b5fe0; --user-text: #ffffff;
    --warn-bg: #3a2f10; --warn-text: #f3c969; --danger-bg: #3b1d1d; --danger-text: #ff9c9c;
    --shadow: 0 12px 48px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.9 var(--font);
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  button { font-family: inherit; }

  .app {
    width: 100%; max-width: 860px; height: min(100%, 880px); display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
    overflow: hidden; position: relative;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand-mark {
    flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
    background: linear-gradient(135deg, var(--brand), #7d9bff); color: #fff; box-shadow: 0 6px 16px rgba(47, 91, 234, .35);
  }
  .brand { flex: 1; min-width: 0; }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.5; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(34, 182, 106, .2); }
  .icon-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px;
    border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); background: var(--bot-bg); }
  .icon-btn svg { width: 18px; height: 18px; flex: none; }
  .icon-btn.square { width: 38px; padding: 0; justify-content: center; }
  .icon-btn:focus-visible, .send:focus-visible, .suggest:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  .demo-note {
    background: var(--warn-bg); color: var(--warn-text); font-size: 12.5px; text-align: center; padding: 6px 12px;
  }

  /* ---------- messages ---------- */
  #log {
    flex: 1; overflow-y: auto; padding: 22px 18px 10px; display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth; overscroll-behavior: contain;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  .welcome { margin: auto; text-align: center; max-width: 560px; padding: 8px 4px 24px; animation: rise .35s ease-out; }
  .welcome .hero {
    width: 72px; height: 72px; margin: 0 auto 14px; border-radius: 22px; display: grid; place-items: center; font-size: 34px;
    background: var(--brand-soft);
  }
  .welcome h2 { margin: 0 0 6px; font-size: 20px; }
  .welcome p { margin: 0 0 20px; color: var(--muted); }
  .suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .suggest {
    display: flex; align-items: center; gap: 10px; text-align: right; padding: 12px 14px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 13.5px; line-height: 1.7;
    cursor: pointer; transition: transform .12s, border-color .15s, background .15s;
  }
  .suggest:hover { border-color: var(--brand); background: var(--brand-soft); transform: translateY(-1px); }
  .suggest span.ic { font-size: 18px; flex: none; }

  .row { display: flex; gap: 10px; max-width: 100%; animation: rise .22s ease-out; }
  .row.user { align-self: flex-start; }               /* start = right edge in RTL */
  .row.bot  { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: var(--brand-soft); font-size: 17px; align-self: flex-end;
  }
  .bubble-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: min(82vw, 600px); }
  .row.user .bubble-wrap { align-items: flex-start; }
  .row.bot .bubble-wrap { align-items: flex-end; }
  .bubble {
    padding: 10px 15px; border-radius: 18px; overflow-wrap: anywhere; background: var(--bot-bg); text-align: start;
  }
  .row.user .bubble { background: var(--user-bg); color: var(--user-text); border-end-start-radius: 4px; }
  .row.bot .bubble { border-end-end-radius: 4px; }
  .row.error .bubble { background: var(--danger-bg); color: var(--danger-text); }
  .bubble p { margin: 0; }
  .bubble p + p, .bubble p + ul, .bubble ul + p, .bubble ol + p, .bubble p + ol { margin-top: 8px; }
  .bubble ul, .bubble ol { margin: 0; padding-inline-start: 22px; }
  .bubble li { padding-inline-start: 2px; }
  .bubble a {
    color: inherit; text-decoration: underline; text-underline-offset: 3px; direction: ltr; unicode-bidi: isolate;
    display: inline-block; max-width: 100%; vertical-align: bottom; overflow-wrap: anywhere;
  }
  .row.bot .bubble a { color: var(--brand-strong); }

  .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11.5px; padding: 0 4px; line-height: 1.4; }
  .copy {
    border: 0; background: transparent; color: var(--muted); font-size: 11.5px; cursor: pointer; padding: 2px 4px;
    border-radius: 6px; opacity: 0; transition: opacity .15s;
  }
  .row:hover .copy, .copy:focus-visible { opacity: 1; }
  .copy:hover { color: var(--text); }
  @media (hover: none) { .copy { opacity: 1; } }

  .badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; background: var(--warn-bg); color: var(--warn-text);
  }
  .retry {
    margin-top: 8px; padding: 4px 14px; border-radius: 10px; border: 1px solid currentColor; background: transparent;
    color: inherit; font-size: 13px; cursor: pointer;
  }
  .typing { display: inline-flex; align-items: center; gap: 4px; height: 26px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  .typing-label { margin-inline-start: 8px; color: var(--muted); font-size: 12.5px; }

  .to-bottom {
    position: absolute; inset-inline-start: 50%; bottom: 96px; transform: translateX(50%); z-index: 2;
    padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .15); font-size: 12.5px; cursor: pointer;
  }
  html[dir="rtl"] .to-bottom { transform: translateX(50%); }

  /* ---------- composer ---------- */
  .composer { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); background: var(--panel); }
  .field {
    display: flex; align-items: flex-end; gap: 8px; padding: 6px 8px 6px 6px; border-radius: 20px;
    border: 1.5px solid var(--line); background: var(--bg); transition: border-color .15s, box-shadow .15s;
  }
  .field:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  textarea {
    flex: 1; resize: none; border: 0; outline: none; background: transparent; color: var(--text); font: inherit;
    max-height: 150px; padding: 8px 10px; line-height: 1.8; min-width: 0;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    flex: none; width: 42px; height: 42px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: var(--brand); color: var(--on-brand); transition: transform .12s, opacity .15s, background .15s;
  }
  .send:hover:not(:disabled) { background: var(--brand-strong); transform: scale(1.05); }
  .send:disabled { opacity: .4; cursor: default; }
  .send svg { width: 20px; height: 20px; transform: scaleX(-1); }   /* arrow points to the left in RTL */
  .hint { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px 0; color: var(--muted); font-size: 11.5px; }
  .counter.over { color: var(--danger-text); font-weight: 700; }

  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; transition: none !important; } }

  @media (max-width: 640px) {
    body { padding: 0; }
    .app { height: 100dvh; border-radius: 0; border: 0; box-shadow: none; max-width: none; }
    .suggestions { grid-template-columns: 1fr; }
    .icon-btn .label { display: none; }
    .icon-btn { width: 38px; padding: 0; justify-content: center; }
    .hint .kbd { display: none; }
    .bubble-wrap { max-width: 86vw; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand-mark" aria-hidden="true">🎓</div>
    <div class="brand">
      <h1>دستیار هوشمند فین‌وایز</h1>
      <div class="status"><span class="dot"></span> آنلاین · پاسخ‌گوی سؤالات دوره‌ها</div>
    </div>
    <button class="icon-btn square" id="theme" type="button" title="تغییر پوسته روشن/تاریک" aria-label="تغییر پوسته">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="icon-btn" id="reset" type="button" title="شروع گفتگوی جدید">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">گفتگوی جدید</span>
    </button>
  </header>

  <div class="demo-note" id="demoNote" hidden>در حال نمایش دوره‌های نمونه هستید (پایگاه داده متصل نیست).</div>

  <div id="log" role="log" aria-live="polite" aria-label="پیام‌های گفتگو"></div>
  <button class="to-bottom" id="toBottom" type="button" hidden>↓ رفتن به آخرین پیام</button>

  <form class="composer" id="form" autocomplete="off">
    <div class="field">
      <textarea id="input" rows="1" maxlength="{{ max_chars }}" placeholder="سؤال خود را بنویسید…" aria-label="متن پیام"></textarea>
      <button class="send" id="send" type="submit" aria-label="ارسال پیام" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
      </button>
    </div>
    <div class="hint">
      <span class="kbd">ارسال با Enter · خط جدید با Shift+Enter</span>
      <span class="counter" id="counter"></span>
    </div>
  </form>
</div>

<script>
(() => {
  const MAX = {{ max_chars }};
  const STORE = 'finwise-chat-v2';
  const CONV = 'finwise-conv-id';
  const SUGGESTIONS = [
    ['📚', 'کدام دوره‌ها الان باز هستند؟'],
    ['💰', 'قیمت دوره حسابداری چقدر است؟'],
    ['🧾', 'برای یادگیری مالیات چه دوره‌ای دارید؟'],
    ['📝', 'چطور ثبت‌نام و پرداخت کنم؟'],
    ['🌱', 'برای افراد مبتدی کدام دوره مناسب است؟'],
    ['🎓', 'آیا پس از دوره گواهینامه صادر می‌شود؟'],
  ];
  const $ = id => document.getElementById(id);
  const log = $('log'), form = $('form'), input = $('input'), sendBtn = $('send');
  const counter = $('counter'), toBottom = $('toBottom'), demoNote = $('demoNote');
  const timeFmt = new Intl.DateTimeFormat('fa-IR', {hour: '2-digit', minute: '2-digit'});
  const numFmt = new Intl.NumberFormat('fa-IR');

  let messages = [];   // {role, content, ts, escalated?}
  let conversationId = 0;
  let busy = false;

  const csrf = () => (document.cookie.match(/csrftoken=([^;]+)/) || [])[1] || '';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage may be blocked */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };

  function newConversationId() {
    conversationId = Math.floor(Math.random() * 2 ** 52) + 1;   // admins see this conversation under this number
    store.set(CONV, String(conversationId));
  }
  conversationId = parseInt(store.get(CONV), 10) || 0;
  if (!conversationId) newConversationId();

  /* ---------- theme ---------- */
  function applyTheme(t) { document.documentElement.dataset.theme = t; }
  applyTheme(store.get('finwise-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  $('theme').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme(next); store.set('finwise-theme', next);
  });

  /* ---------- safe rendering: text -> DOM (never innerHTML) ---------- */
  const URL_RE = /(https?:\/\/[^\s<>()]+[^\s<>().,;:!?،؛»])/g;
  const BULLET_RE = /^\s*(?:[-•*–]|\d+[.)]|[۰-۹]+[.)])\s+/;

  function inline(el, text) {
    // **bold** and links, appended as DOM nodes.
    text.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
      const bold = part.length > 4 && part.startsWith('**') && part.endsWith('**');
      const host = bold ? el.appendChild(document.createElement('strong')) : el;
      const str = bold ? part.slice(2, -2) : part;
      let last = 0, m;
      URL_RE.lastIndex = 0;
      while ((m = URL_RE.exec(str))) {
        host.append(str.slice(last, m.index));
        const a = document.createElement('a');
        a.href = m[1]; a.textContent = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer';
        host.append(a);
        last = URL_RE.lastIndex;
      }
      host.append(str.slice(last));
    });
  }

  function render(el, text) {
    el.textContent = '';
    const lines = text.replace(/\r/g, '').split('\n');
    let para = null, list = null;
    const flush = () => { para = null; list = null; };
    for (const raw of lines) {
      const line = raw.trimEnd();
      if (!line.trim()) { flush(); continue; }
      if (BULLET_RE.test(line)) {
        const ordered = /^\s*(?:\d+|[۰-۹]+)[.)]/.test(line);
        if (!list || list.tagName !== (ordered ? 'OL' : 'UL')) {
          list = el.appendChild(document.createElement(ordered ? 'ol' : 'ul')); para = null;
        }
        inline(list.appendChild(document.createElement('li')), line.replace(BULLET_RE, ''));
      } else {
        list = null;
        if (!para) para = el.appendChild(document.createElement('p'));
        else para.append(document.createElement('br'));
        inline(para, line);
      }
    }
  }

  /* ---------- UI building blocks ---------- */
  function scrollDown(force) {
    const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
    if (force || near) log.scrollTop = log.scrollHeight;
  }

  function addRow(role, opts = {}) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    if (role === 'bot') {
      const av = document.createElement('div');
      av.className = 'avatar'; av.textContent = '🤖'; av.setAttribute('aria-hidden', 'true');
      row.append(av);
    }
    const wrap = document.createElement('div'); wrap.className = 'bubble-wrap';
    const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.dir = 'auto';
    wrap.append(bubble);
    row.append(wrap);
    log.append(row);
    if (opts.typing) {
      bubble.innerHTML = '<span class="typing" aria-label="در حال نوشتن"><i></i><i></i><i></i></span><span class="typing-label">در حال نوشتن…</span>';
    }
    return {row, wrap, bubble};
  }

  function addMeta(wrap, msg) {
    const meta = document.createElement('div'); meta.className = 'meta';
    const t = document.createElement('span'); t.textContent = timeFmt.format(new Date(msg.ts));
    meta.append(t);
    if (msg.role === 'assistant') {
      const copy = document.createElement('button');
      copy.type = 'button'; copy.className = 'copy'; copy.textContent = 'کپی';
      copy.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(msg.content); copy.textContent = 'کپی شد ✓'; }
        catch (e) { copy.textContent = 'ناموفق'; }
        setTimeout(() => { copy.textContent = 'کپی'; }, 1500);
      });
      meta.append(copy);
    }
    wrap.append(meta);
  }

  function showMessage(msg) {
    const {row, wrap, bubble} = addRow(msg.role === 'user' ? 'user' : 'bot');
    render(bubble, msg.content);
    if (msg.escalated) {
      const b = document.createElement('div'); b.className = 'badge';
      b.textContent = '✋ سؤال شما برای کارشناسان ارسال شد';
      bubble.append(b);
    }
    addMeta(wrap, msg);
    return row;
  }

  function showError(text, retry) {
    const {row, bubble} = addRow('bot');
    row.classList.add('error');
    const p = document.createElement('p'); p.textContent = text; bubble.append(p);
    if (retry) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'retry'; btn.textContent = 'تلاش دوباره';
      btn.addEventListener('click', () => { row.remove(); retry(); });
      bubble.append(btn);
    }
    scrollDown(true);
  }

  function showWelcome() {
    const w = document.createElement('div'); w.className = 'welcome'; w.id = 'welcome';
    w.innerHTML = '<div class="hero" aria-hidden="true">👋</div>' +
      '<h2>سلام! به فین‌وایز خوش آمدید</h2>' +
      '<p>درباره دوره‌ها، قیمت‌ها، زمان‌بندی، مدرسان و نحوه ثبت‌نام هر سؤالی دارید بپرسید.</p>';
    const grid = document.createElement('div'); grid.className = 'suggestions';
    SUGGESTIONS.forEach(([icon, q]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'suggest';
      const i = document.createElement('span'); i.className = 'ic'; i.textContent = icon;
      b.append(i, document.createTextNode(q));
      b.addEventListener('click', () => send(q));
      grid.append(b);
    });
    w.append(grid);
    log.append(w);
  }

  /* ---------- state ---------- */
  function save() { store.set(STORE, JSON.stringify(messages.slice(-60))); }

  function redraw() {
    log.textContent = '';
    if (!messages.length) showWelcome();
    else messages.forEach(showMessage);
    log.scrollTop = log.scrollHeight;
  }

  function reset() {
    messages = []; store.del(STORE); newConversationId(); redraw(); input.value = ''; autosize(); input.focus();
  }

  function restore() {
    try {
      const saved = JSON.parse(store.get(STORE) || '[]');
      if (Array.isArray(saved)) {
        messages = saved.filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string')
          .map(m => ({...m, ts: m.ts || Date.now()}));
      }
    } catch (e) { messages = []; }
    // The API needs a conversation that ends with the assistant's reply.
    while (messages.length && messages[messages.length - 1].role === 'user') messages.pop();
  }

  /* ---------- sending ---------- */
  async function send(text) {
    text = (text || '').trim();
    if (busy || !text) return;
    if (text.length > MAX) { showError(`پیام شما بیش از حد طولانی است (حداکثر ${numFmt.format(MAX)} نویسه).`); return; }
    if (!navigator.onLine) { showError('اتصال اینترنت شما برقرار نیست.', () => send(text)); return; }

    setBusy(true);
    $('welcome')?.remove();
    const userMsg = {role: 'user', content: text, ts: Date.now()};
    messages.push(userMsg);
    const userRow = showMessage(userMsg);
    scrollDown(true);
    const pending = addRow('bot', {typing: true});
    scrollDown(true);

    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 90000);
    try {
      const res = await fetch('/api/chat/', {
        method: 'POST', signal: ctl.signal,
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf()},
        body: JSON.stringify({conversation_id: conversationId, messages: messages.map(({role, content}) => ({role, content}))}),
      });
      let data = {};
      try { data = await res.json(); } catch (e) { /* non-JSON error page */ }
      if (!res.ok) throw new Error(data.error || `خطای سرور (${numFmt.format(res.status)})`);
      pending.row.remove();
      const botMsg = {role: 'assistant', content: data.answer, ts: Date.now(), escalated: !!data.escalated};
      messages.push(botMsg);
      showMessage(botMsg);
      demoNote.hidden = !data.demo_data;
      save();
    } catch (err) {
      pending.row.remove();
      messages.pop();                       // the failed question is not part of the history
      const msg = err.name === 'AbortError' ? 'پاسخ‌گویی بیش از حد طول کشید.'
        : err instanceof TypeError ? 'ارتباط با سرور برقرار نشد.'
        : err.message;
      showError(msg + ' لطفاً دوباره تلاش کنید.', () => { userRow.remove(); send(text); });
    } finally {
      clearTimeout(timer);
      setBusy(false);
      scrollDown(true);
      input.focus();
    }
  }

  function setBusy(v) { busy = v; updateSend(); }
  function updateSend() { sendBtn.disabled = busy || !input.value.trim(); }

  /* ---------- composer ---------- */
  function autosize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    const n = input.value.length;
    counter.textContent = n > MAX * 0.8 ? `${numFmt.format(n)} / ${numFmt.format(MAX)}` : '';
    counter.classList.toggle('over', n >= MAX);
    updateSend();
  }
  input.addEventListener('input', autosize);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value;
    if (busy || !text.trim()) return;
    input.value = ''; autosize();
    send(text);
  });
  $('reset').addEventListener('click', () => {
    if (!messages.length || confirm('گفتگوی فعلی پاک شود و گفتگوی تازه‌ای شروع شود؟')) reset();
  });

  log.addEventListener('scroll', () => {
    toBottom.hidden = log.scrollHeight - log.scrollTop - log.clientHeight < 240;
  }, {passive: true});
  toBottom.addEventListener('click', () => { log.scrollTop = log.scrollHeight; });

  restore();
  redraw();
  autosize();
  input.focus();
})();
</script>
</body>
</html>
